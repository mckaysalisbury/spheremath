
<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>US Temple Locations</title>
    <style>
        h1 {
            text-align: center;
        }

        /* d3 */
        path {
            stroke: #fff;
            fill: #3c81f4;
            stroke-width: 0.5;
        }

        .temple {
            fill: #1c3b6f;
            stroke: white;
            stroke-width: 0.5px;
            r: 5px;
        }

        .stake {
            fill: #c31b6f;
            stroke: white;
            stroke-width: 0.2px;
            r: 2px;
        }

    </style>
    <script src="https://github.mckaysalisbury.com/ListBoy/ListBoy.js"></script>
    <script src="https://d3js.org/d3.v5.min.js"></script>
    <script src="https://d3js.org/topojson.v1.min.js"></script>
    <script>
        async function fetchXml(url, selector) {
            const response = await fetch(url)
            const text = await response.text();

            doc = new DOMParser().parseFromString(text, 'text/xml');

            return doc.querySelectorAll(selector)
        }

        function placemarkToData(placemark) {
            const name = placemark.querySelector("name").textContent;
            const coordinates = placemark.querySelector("coordinates").textContent;
            const style = placemark.querySelector("styleUrl").textContent;
            const [long, lat, altitude] = coordinates.split(',').map(parseFloat);
            return { name: name, lat: lat, long: long, style: style }
        }

        function fetchKmlToD3(url, cssClass) {
            return fetchXml(url, 'Placemark').then((nodes) => {
                const entries = Array.from(nodes).map(placemarkToData);
                entriesToD3(entries, cssClass);
                return entries;
            });
        }

        function calculateProjection(svg) {
            const node = svg.node();
            const scale = Math.max(node.clientHeight, node.clientWidth)
            const projection = d3.geoAlbers()
                .scale(scale)
                .translate([node.clientWidth / 2, node.clientHeight / 2]);
            return projection;
        }

        async function d3InitializeStates(mapData) {
            const svg = d3.select("#map");

            projection = calculateProjection(svg);
        
            const path = d3.geoPath()
                .projection(projection);

            mapData = await d3.json('https://cdn.jsdelivr.net/npm/us-atlas@3/counties-10m.json');
            svg.append('path')
                .attr('class', 'states')
                .datum(topojson.feature(mapData, mapData.objects.states))
                .attr('d', path);

            return mapData;
        }

        function d3Coords(item) {
            return [item.long, item.lat]; // It's backwards from how we think of it, but it's x, y
        }

        function entriesToD3(entries, cssClass) {
            const svg = d3.select("#map");
            projection = calculateProjection(svg);

            for (entry of entries) {
                const coords = projection(d3Coords(entry));
                svg.append('circle')
                    .attr('cx', coords[0])
                    .attr('cy', coords[1])
                    .attr('class', cssClass)
                    .append('title').text(entry.name)

            }
        }

        function isDistrict(unit) {
            // I wish there was a better way
            return unit.style == "#msn_blu-circle";
        }

        function nearestAmong(target, list) {
            return list.map(i => {
                const item = Object.assign({}, i); // clone it so we don't mess up the original
                item.distanceToTarget = d3.geoDistance(d3Coords(target), d3Coords(item)) * 3958.8; // miles
                return item;
            }).sort((a, b) => a.distanceToTarget - b.distanceToTarget);
        }

        async function renderAll() {
            await d3InitializeStates()
            const temples = await fetchKmlToD3('data/ChurchofJesusChristTemples.kml', 'temple');
            // console.log('Temples', temples);
            const units = await fetchKmlToD3('data/ChurchofJesusChristUnits.kml', 'stake');
            // console.log('Units', units);
            const stakes = units.filter(unit => !isDistrict(unit));
            // console.log('Stakes', stakes);

            // Find nearest temples for each stake
            stakes.forEach((stake) => {
                const nearestTemples = nearestAmong(stake, temples); // bigO(temples)
                stake.distanceToNearestTemple = nearestTemples[0]?.distanceToTarget ?? Infinity;
                stake.nearestTemples = nearestTemples.slice(0, 3);
            });
            console.log('Stakes with nearest temple data', stakes);
            // TODO: Find all stakes by distance for each stake.
            // TODO: Find which stakes would be closer to this stake than their nearest temple.
            // TODO: Sum the difference in that distance for all those stakes.

            const sorted = stakes.sort((a, b) => {
                const aDist = a.distanceToNearestTemple;
                const bDist = b.distanceToNearestTemple;
                return bDist - aDist;
            });

            console.log('Sorted', sorted);
            ListBoy.RenderTo(sorted.slice(0, 10).map(item => {
                return {
                    name: item.name,
                    distanceToNearestTemple: item.distanceToNearestTemple.toFixed(1) + ' miles',
                    nearestTemple: item.nearestTemples[0]?.name ?? 'N/A',
                };
            }), 'main');
        }
    </script>
  </head>
  <body>    
      <h1>US Temple locations</h1>
      <svg width="80%" height="80vh" id="map"></svg>
      <div id='main'></div>
  </body>
  <script>
    renderAll();
  </script>
</html>
