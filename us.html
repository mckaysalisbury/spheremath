
<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>US Temple Locations</title>
    <style>
        h1 {
            text-align: center;
        }

        /* d3 */
        path {
            stroke: #fff;
            fill: #3c81f4;
            stroke-width: 0.5;
        }

        .temple {
            fill: #1c3b6f;
            stroke: white;
            stroke-width: 0.5px;
            r: 5px;
        }

        .stake {
            fill: #c31b6f;
            stroke: white;
            stroke-width: 0.2px;
            r: 2px;
        }

    </style>
    <script src="https://github.mckaysalisbury.com/ListBoy/ListBoy.js"></script>
    <script src="https://d3js.org/d3.v3.min.js"></script>
    <script src="https://d3js.org/topojson.v1.min.js"></script>
    <script>
        async function fetchXml(url, selector) {
            const response = await fetch(url)
            const text = await response.text();

            doc = new DOMParser().parseFromString(text, 'text/xml');

            return doc.querySelectorAll(selector)
        }

        function placemarkToData(placemark) {
            const name = placemark.querySelector("name").textContent;
            const coordinates = placemark.querySelector("coordinates").textContent;
            const style = placemark.querySelector("styleUrl").textContent;
            const [long, lat, altitude] = coordinates.split(',').map(parseFloat);
            return { name: name, lat: lat, long: long, style: style }
        }

        function fetchKmlToD3(url, cssClass) {
            return fetchXml(url, 'Placemark').then((nodes) => {
                const entries = Array.from(nodes).map(placemarkToData);
                entriesToD3(entries, cssClass);
                return entries;
            });
        }



        function calculateProjection(svg) {
            const node = svg.node();
            const scale = Math.max(node.clientHeight, node.clientWidth)
            const projection = d3.geo.albers()
                .scale(scale)
                .translate([node.clientWidth / 2, node.clientHeight / 2]);
            return projection;
        }

        // D3 map
        function d3InitializeStates(mapData) {
            const svg = d3.select("#map");

            projection = calculateProjection(svg);
        
            const path = d3.geo.path()
                .projection(projection);

            return new Promise((resolve, reject) => {                
                d3.json('https://cdn.jsdelivr.net/npm/us-atlas@3/counties-10m.json', function (mapData) {        
                    svg.append('path')
                    .attr('class', 'states')
                    .datum(topojson.feature(mapData, mapData.objects.states))
                    .attr('d', path);
                    resolve();
                });
            });
        }

        function entriesToD3(entries, cssClass) {
            const svg = d3.select("#map");
            projection = calculateProjection(svg);

            for (entry of entries) {
                const coords = projection([entry.long, entry.lat]);
                svg.append('circle')
                    .attr('cx', coords[0])
                    .attr('cy', coords[1])
                    .attr('class', cssClass)
                    .append('title').text(entry.name)

            }
        }

        async function renderAll() {
            await d3InitializeStates()
            temples = await fetchKmlToD3('data/ChurchofJesusChristTemples.kml', 'temple');
            units = await fetchKmlToD3('data/ChurchofJesusChristUnits.kml', 'stake');
        }
    </script>
  </head>
  <body>    
      <h1>US Temple locations</h1>
      <svg width="80%" height="80vh" id="map"></svg>
      <div id='main'></div>
  </body>
  <script>
    renderAll();
  </script>
</html>
